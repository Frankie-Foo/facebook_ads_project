{% extends "base.html" %}

{% block title %}Facebook广告助手{% endblock %}

{% block styles %}
<style>
.chat-container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.message-list {
    height: 500px;
    overflow-y: auto;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #e8e8e8;
    border-radius: 4px;
}

.message {
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
}

.message.user {
    align-items: flex-end;
}

.message.assistant {
    align-items: flex-start;
}

.message-content {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 4px;
    word-break: break-word;
}

.user .message-content {
    background: #1890ff;
    color: white;
}

.assistant .message-content {
    background: #f0f0f0;
    color: rgba(0,0,0,0.85);
}

.message-time {
    font-size: 12px;
    color: rgba(0,0,0,0.45);
    margin-top: 4px;
}

.input-container {
    display: flex;
    gap: 8px;
}

.input-container .ant-input {
    flex: 1;
}
</style>
{% endblock %}

{% block content %}
<div id="chat-app" class="chat-container">
    <div class="message-list">
        <div v-for="msg in messages" 
             :key="msg.timestamp" 
             :class="['message', msg.is_user ? 'user' : 'assistant']">
            <div class="message-content">[[ msg.content ]]</div>
            <div class="message-time">[[ new Date(msg.timestamp).toLocaleString() ]]</div>
        </div>
    </div>
    
    <div class="input-container">
        <a-input 
            v-model:value="message" 
            placeholder="请输入消息..." 
            :disabled="loading"
            @keyup.enter="sendMessage"
        />
        <a-button 
            type="primary" 
            :loading="loading"
            @click="sendMessage"
        >
            发送
        </a-button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
