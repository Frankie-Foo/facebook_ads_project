<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>Facebook广告数据分析</title>
    <meta charset="UTF-8">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* 日间模式样式 */
        :root[data-theme="light"] {
            --bg-color: #1a1a1a;
            --text-color: #DAA520;  /* 金菊色 */
            --card-bg: #2d2d2d;
            --card-text: #DAA520;   /* 金菊色 */
            --label-color: #DAA520; /* 金菊色 */
            --chart-bg: #2d2d2d;
            --chart-text: #DAA520;  /* 金菊色 */
            --border-color: #3d3d3d;
            --card-shadow: 0 4px 16px rgba(128, 128, 128, 0.1);  /* 深色主题下的灰色阴影，10%透明度 */
            --module-shadow: 0 8px 24px rgba(128, 128, 128, 0.1);  /* 模块的灰色阴影，10%透明度 */
        }

        /* 夜间模式样式 */
        :root[data-theme="dark"] {
            --bg-color: #ffffff;
            --text-color: #333333;  /* 黑色文字 */
            --card-bg: #e8e8e8;    /* 卡片背景改为稍深的灰色 */
            --card-text: #333333;   /* 黑色文字 */
            --label-color: #666666; /* 浅黑色标签 */
            --chart-bg: #e8e8e8;    /* 图表背景改为稍深的灰色 */
            --chart-text: #333333;  /* 黑色文字 */
            --border-color: #e0e0e0;
            --card-shadow: 0 2px 12px rgba(128, 128, 128, 0.1);  /* 浅色主题下的灰色阴影，10%透明度 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease;
        }

        .metric-card {
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background-color: #ffffff;
        }
        
        .chart-container {
            height: 350px;
            margin: 20px 0;
        }
        
        .summary-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            transition: transform 0.3s ease;
            box-shadow: var(--card-shadow);
        }
        
        .summary-card:hover {
            transform: translateY(-5px);
        }
        
        .summary-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--card-text);
        }
        
        .summary-label {
            font-size: 14px;
            color: var(--label-color);
        }
        
        .chart-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            box-shadow: var(--card-shadow);
        }
        
        .chart-title {
            color: var(--text-color);  /* 使用主题文字颜色 */
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .control-panel {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
        }
        
        .date-input {
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            background-color: #ffffff;
        }
        
        .date-input:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }
        
        .loading-spinner {
            background: rgba(255,255,255,0.95);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(128, 128, 128, 0.2);
        }
        
        .error-message {
            background-color: #fef2f2;
            color: #991b1b;
            border-color: #fecaca;
            border-radius: 10px;
        }

        .btn-outline-primary {
            border-color: #4299e1;
            color: #4299e1;
        }

        .btn-outline-primary:hover {
            background-color: #4299e1;
            border-color: #4299e1;
            color: #ffffff;
        }

        .btn-primary {
            background-color: #4299e1;
            border-color: #4299e1;
        }

        .btn-primary:hover {
            background-color: #3182ce;
            border-color: #3182ce;
        }

        .page-title {
            color: #DAA520 !important;  /* 强制使用金菊色 */
            font-weight: 600;
            margin-bottom: 2rem;
        }

        /* 主题切换按钮样式 */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            opacity: 0.9;
        }

        /* 数据概览区域 */
        .row.mb-4 {
            box-shadow: var(--module-shadow);
            border-radius: 15px;
            padding: 20px;
            margin: 0 2px 2rem 2px;  /* 添加左右间距 */
            background: var(--bg-color);
        }

        /* 图表区域 */
        .row:has(.chart-card) {
            box-shadow: var(--module-shadow);
            border-radius: 15px;
            padding: 20px;
            margin: 0 2px 2rem 2px;  /* 添加左右间距 */
            background: var(--bg-color);
        }
    </style>
</head>
<body>
    <!-- 主题切换按钮 -->
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span>
        <span id="theme-text">夜间模式</span>
    </button>

    <div class="container-fluid px-4 py-3">
        <h1 class="text-center page-title">Facebook广告数据分析</h1>
        
        <!-- 日期选择器面板 -->
        <div class="row">
            <div class="col-md-8">
                <div class="control-panel">
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <div class="btn-group mb-2 mb-md-0" role="group">
                            <button type="button" class="btn btn-outline-primary" onclick="setDateRange('yesterday')">昨日</button>
                            <button type="button" class="btn btn-outline-primary" onclick="setDateRange('last30')">最近30天</button>
                            <button type="button" class="btn btn-outline-primary" onclick="setDateRange('lastMonth')">上月</button>
                            <button type="button" class="btn btn-outline-primary" onclick="setDateRange('thisMonth')">本月</button>
                        </div>
                        <div class="d-flex align-items-center">
                            <label for="startDate" class="me-2 text-nowrap">开始日期:</label>
                            <input type="date" id="startDate" class="form-control date-input me-2" title="开始日期">
                            <span class="mx-2 text-nowrap">至</span>
                            <label for="endDate" class="me-2 text-nowrap">结束日期:</label>
                            <input type="date" id="endDate" class="form-control date-input me-2" title="结束日期">
                            <button class="btn btn-primary" onclick="fetchDataWithDateRange()">查询</button>
                        </div>
                    </div>
                    <div class="mt-3">
                        <small class="text-muted" id="date-range"></small>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 加载提示 -->
        <div id="loading-message" class="loading-spinner text-center p-3 mb-3" style="display: none;">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <span class="ms-2">数据加载中...</span>
        </div>
        
        <!-- 数据概览区域 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-value" id="total-spend">--</div>
                    <div class="summary-label">总花费 ($)</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-value" id="total-clicks">--</div>
                    <div class="summary-label">链接点击</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-value" id="total-impressions">--</div>
                    <div class="summary-label">总展现量</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-value" id="avg-ctr">--</div>
                    <div class="summary-label">点击率 (%)</div>
                </div>
            </div>
        </div>
        
        <!-- 转化指标区域 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-value" id="total-conversion">--</div>
                    <div class="summary-label">总转化金额 ($)</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-value" id="avg-cpc">--</div>
                    <div class="summary-label">CPC ($)</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-value" id="total-messages">--</div>
                    <div class="summary-label">加购</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-card">
                    <div class="summary-value" id="total-checkout">--</div>
                    <div class="summary-label">总发起结账</div>
                </div>
            </div>
        </div>
        
        <!-- 图表区域 -->
        <div class="row">
            <div class="col-12 mb-4">
                <div class="chart-card">
                    <h5 class="chart-title">花费与转化趋势</h5>
                    <div id="spend-conversion-chart" class="chart-container"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 mb-4">
                <div class="chart-card">
                    <h5 class="chart-title">点击和展示趋势</h5>
                    <div id="clicks-impressions-chart" class="chart-container"></div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 mb-4">
                <div class="chart-card">
                    <h5 class="chart-title">ROI趋势</h5>
                    <div id="roi-chart" class="chart-container"></div>
                </div>
            </div>
        </div>
        
        <!-- 错误提示 -->
        <div id="error-message" class="error-message alert mt-3" style="display: none;"></div>
    </div>

    <script>
        // 设置日期范围
        function setDateRange(type) {
            const today = new Date();
            let startDate, endDate;
            
            switch(type) {
                case 'yesterday':
                    endDate = new Date(today);
                    endDate.setDate(endDate.getDate() - 1);  // 昨天
                    startDate = new Date(endDate);  // 同一天
                    break;
                case 'last30':
                    endDate = new Date(today);  // 今天
                    startDate = new Date(today);
                    startDate.setDate(startDate.getDate() - 30);  // 30天前
                    break;
                case 'lastMonth':
                    // 上月第一天
                    startDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                    // 上月最后一天
                    endDate = new Date(today.getFullYear(), today.getMonth(), 0);
                    break;
                case 'thisMonth':
                    // 本月第一天
                    startDate = new Date(today.getFullYear(), today.getMonth(), 1);
                    // 今天
                    endDate = new Date(today);
                    break;
            }
            
            document.getElementById('startDate').value = formatDate(startDate);
            document.getElementById('endDate').value = formatDate(endDate);
            fetchDataWithDateRange();
        }
        
        // 格式化日期
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }
        
        // 获取指定日期范围的数据
        async function fetchDataWithDateRange() {
            const startDateElement = document.getElementById('startDate');
            const endDateElement = document.getElementById('endDate');
            const loadingMessageElement = document.getElementById('loading-message');
            const errorMessageElement = document.getElementById('error-message');
            
            // 显示加载提示
            if (loadingMessageElement) {
                loadingMessageElement.style.display = 'block';
            }
            
            try {
                const response = await fetch(`/api/detailed-insights?start_date=${startDateElement.value}&end_date=${endDateElement.value}`);
                const data = await response.json();
                
                if (!data.data || data.data.length === 0) {
                    console.warn('未获取到数据');
                    if (errorMessageElement) {
                        errorMessageElement.style.display = 'block';
                        errorMessageElement.textContent = '未获取到数据，请检查日期范围或账户权限';
                    }
                    return;
                }
                
                // 处理数据
                const insights = data.data;
                insights.sort((a, b) => new Date(a.date_start) - new Date(b.date_start));
                
                // 添加数据验证日志
                console.log('原始数据:', insights);
                
                // 获取选择的日期范围
                const startDate = new Date(startDateElement.value);
                const endDate = new Date(endDateElement.value);
                
                // 生成完整的日期序列
                const dateRange = [];
                let currentDate = new Date(startDate);
                
                // 确保日期比较时使用相同的时区
                while (currentDate <= endDate) {
                    const formattedDate = formatDate(currentDate);
                    dateRange.push(formattedDate);
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                console.log('生成的日期范围:', dateRange);
                
                // 创建日期到数据的映射
                const dateDataMap = {};
                insights.forEach(item => {
                    dateDataMap[item.date_start] = item;
                });
                
                console.log('日期数据映射:', dateDataMap);
                
                // 根据完整日期序列生成图表数据
                const spendData = dateRange.map(date => {
                    const item = dateDataMap[date];
                    const value = item ? parseFloat(item.spend || 0) : 0;
                    console.log(`日期 ${date} 的花费:`, value);
                    return value;
                });
                
                const conversionData = dateRange.map(date => {
                    const item = dateDataMap[date];
                    let value = 0;
                    if (item && item.action_values && Array.isArray(item.action_values)) {
                        const purchase = item.action_values.find(v => v.action_type === 'purchase');
                        value = purchase ? parseFloat(purchase.value || 0) : 0;
                    }
                    console.log(`日期 ${date} 的转化:`, value);
                    return value;
                });
                
                // 检查最终的图表数据
                console.log('图表数据:', {
                    dates: dateRange,
                    spend: spendData,
                    conversion: conversionData
                });
                
                // 计算汇总数据
                let totalSpend = 0;
                let totalInlineClicks = 0;
                let totalImpressions = 0;
                let totalConversion = 0;
                let totalMessages = 0;
                let totalCheckout = 0;
                
                insights.forEach(item => {
                    totalSpend += parseFloat(item.spend || 0);
                    totalInlineClicks += parseInt(item.inline_link_clicks || 0);
                    totalImpressions += parseInt(item.impressions || 0);
                    
                    // 处理转化数据
                    if (item.action_values && Array.isArray(item.action_values)) {
                        const purchase = item.action_values.find(v => v.action_type === 'purchase');
                        if (purchase) {
                            totalConversion += parseFloat(purchase.value || 0);
                        }
                    }
                    
                    // 处理行为数据
                    if (item.actions && Array.isArray(item.actions)) {
                        const addToCart = item.actions.find(v => v.action_type === 'add_to_cart');
                        const checkout = item.actions.find(v => v.action_type === 'initiate_checkout');
                        
                        if (addToCart) totalMessages += parseInt(addToCart.value || 0);
                        if (checkout) totalCheckout += parseInt(checkout.value || 0);
                    }
                });
                
                // 使用 API 返回的准确值
                const lastRecord = insights[insights.length - 1];
                const ctr = lastRecord ? parseFloat(lastRecord.inline_link_click_ctr || 0).toFixed(2) : 0;
                const cpc = lastRecord ? parseFloat(lastRecord.cpc || 0).toFixed(2) : 0;
                
                // 更新汇总数据显示
                document.getElementById('total-spend').textContent = totalSpend.toFixed(2);
                document.getElementById('total-clicks').textContent = totalInlineClicks;
                document.getElementById('total-impressions').textContent = totalImpressions;
                document.getElementById('avg-ctr').textContent = ctr;
                document.getElementById('total-conversion').textContent = totalConversion.toFixed(2);
                document.getElementById('avg-cpc').textContent = cpc;
                document.getElementById('total-messages').textContent = totalMessages;
                document.getElementById('total-checkout').textContent = totalCheckout;
                
                // 图表配置
                const chartStyle = {
                    grid: {
                        left: '3%',
                        right: '4%',
                        bottom: '3%',
                        containLabel: true
                    },
                    backgroundColor: '#f5f5f5',  // 浅灰色背景
                    // 添加阴影效果
                    series: [{
                        itemStyle: {
                            shadowBlur: 20,
                            shadowColor: 'rgba(128, 128, 128, 0.2)',
                            shadowOffsetY: 10
                        },
                        lineStyle: {
                            width: 2,
                            shadowBlur: 20,
                            shadowColor: 'rgba(128, 128, 128, 0.2)',
                            shadowOffsetY: 10
                        },
                        areaStyle: {
                            opacity: 0.2,
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0,
                                    color: 'rgba(58, 77, 233, 0.4)'
                                }, {
                                    offset: 1,
                                    color: 'rgba(58, 77, 233, 0.2)'
                                }]
                            }
                        }
                    }],
                    xAxis: {
                        type: 'category',
                        data: dateRange,
                        axisLabel: {
                            rotate: 45,
                            margin: 15,
                            color: '#333333',
                        },
                        splitLine: {  // 添加网格线
                            show: true,
                            lineStyle: {
                                color: '#e0e0e0'
                            }
                        }
                    },
                    yAxis: {
                        axisLabel: {
                            color: '#333333'
                        },
                        splitLine: {  // 添加网格线
                            show: true,
                            lineStyle: {
                                color: '#e0e0e0'
                            }
                        }
                    },
                    legend: {
                        textStyle: {
                            color: '#333333'
                        }
                    }
                };
                
                // 在绘制图表之前添加检查
                if (typeof echarts === 'undefined') {
                    console.error('ECharts is not loaded');
                    if (errorMessageElement) {
                        errorMessageElement.style.display = 'block';
                        errorMessageElement.textContent = 'ECharts 图表库加载失败，请刷新页面重试';
                    }
                    return;
                }

                // 检查 DOM 元素是否存在
                const spendChartElement = document.getElementById('spend-conversion-chart');
                const clicksChartElement = document.getElementById('clicks-impressions-chart');
                const roiChartElement = document.getElementById('roi-chart');

                if (!spendChartElement || !clicksChartElement || !roiChartElement) {
                    console.error('Chart containers not found');
                    return;
                }

                // 初始化图表
                const spendChart = echarts.init(spendChartElement);
                const clicksChart = echarts.init(clicksChartElement);
                const roiChart = echarts.init(roiChartElement);
                
                // 设置图表数据
                spendChart.setOption({
                    ...chartStyle,
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['花费', '转化金额'] },
                    series: [
                        {
                            name: '花费',
                            type: 'line',
                            data: spendData,
                            connectNulls: false  // 不连接空值点
                        },
                        {
                            name: '转化金额',
                            type: 'line',
                            data: conversionData,
                            connectNulls: false  // 不连接空值点
                        }
                    ]
                });
                
                clicksChart.setOption({
                    ...chartStyle,
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['链接点击', '展示量'] },
                    yAxis: [
                        { type: 'value', name: '链接点击' },
                        { type: 'value', name: '展示量' }
                    ],
                    series: [
                        {
                            name: '链接点击',
                            type: 'line',
                            data: dateRange.map(date => {
                                const item = dateDataMap[date];
                                return item ? parseInt(item.inline_link_clicks || 0) : 0;
                            })
                        },
                        {
                            name: '展示量',
                            type: 'line',
                            yAxisIndex: 1,
                            data: dateRange.map(date => {
                                const item = dateDataMap[date];
                                return item ? parseInt(item.impressions || 0) : 0;
                            })
                        }
                    ]
                });
                
                roiChart.setOption({
                    ...chartStyle,
                    tooltip: { 
                        trigger: 'axis',
                        formatter: function(params) {
                            if (!params || !params[0]) return '';
                            const data = params[0];
                            if (!data || !data.name) return '';
                            return `${data.name}<br/>${data.seriesName || ''}: ${data.value || 0}`;
                        }
                    },
                    legend: { data: ['ROI'] },
                    yAxis: [
                        { 
                            type: 'value',
                            name: 'ROI',
                            axisLabel: {
                                formatter: '{value}'
                            }
                        }
                    ],
                    series: [
                        {
                            name: 'ROI',
                            type: 'line',
                            data: dateRange.map((date, index) => {
                                const spend = spendData[index];
                                const conversion = conversionData[index];
                                return spend > 0 ? parseFloat((conversion / spend).toFixed(2)) : 0;
                            }),
                            markLine: {
                                data: [
                                    {
                                        name: '成本线',
                                        yAxis: 1,
                                        lineStyle: {
                                            type: 'dashed',
                                            color: '#f00'
                                        },
                                        label: {
                                            show: true,
                                            position: 'middle',
                                            formatter: '收支平衡'
                                        }
                                    }
                                ]
                            }
                        }
                    ]
                });
                
                // 添加窗口大小改变时重绘图表
                window.addEventListener('resize', function() {
                    spendChart.resize();
                    clicksChart.resize();
                    roiChart.resize();
                });
                
                // 更新日期范围显示
                const dateRangeElement = document.getElementById('date-range');
                if (dateRangeElement) {
                    dateRangeElement.textContent = 
                        `数据日期范围: ${formatDate(startDate)} 至 ${formatDate(endDate)}`;
                }
                
            } catch (error) {
                console.error('请求失败:', error);
                if (errorMessageElement) {
                    errorMessageElement.style.display = 'block';
                    errorMessageElement.textContent = `请求失败: ${error.toString()}`;
                }
            } finally {
                // 隐藏加载提示
                if (loadingMessageElement) {
                    loadingMessageElement.style.display = 'none';
                }
            }
        }

        // 修改错误处理函数
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Global Error:', {msg, url, lineNo, columnNo, error});
            const errorMessageElement = document.getElementById('error-message');
            if (errorMessageElement) {
                errorMessageElement.style.display = 'block';
                errorMessageElement.textContent = `页面错误: ${msg}`;
            }
            return false;
        };

        // 页面加载完成后设置默认日期范围（最近30天）
        document.addEventListener('DOMContentLoaded', () => {
            setDateRange('last30');
        });

        // 主题切换功能
        function toggleTheme() {
            const root = document.documentElement;
            const currentTheme = root.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            
            root.setAttribute('data-theme', newTheme);
            
            // 更新按钮显示
            if (newTheme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = '日间模式';
            } else {
                icon.textContent = '🌙';
                text.textContent = '夜间模式';
            }
            
            // 更新图表主题
            updateChartsTheme(newTheme);
            
            // 保存主题设置到本地存储
            localStorage.setItem('theme', newTheme);
        }

        // 更新图表主题
        function updateChartsTheme(theme) {
            const chartBg = theme === 'dark' ? '#f5f5f5' : '#2d2d2d';
            const chartText = theme === 'dark' ? '#333333' : '#DAA520';  // 深色模式下使用金菊色
            const shadowColor = theme === 'dark' ? 'rgba(128, 128, 128, 0.2)' : 'rgba(128, 128, 128, 0.3)';
            
            const chartStyle = {
                backgroundColor: chartBg,
                textStyle: { color: chartText },
                axisLabel: { color: chartText },
                legend: { textStyle: { color: chartText } },
                xAxis: {
                    axisLabel: {
                        color: chartText
                    }
                },
                yAxis: {
                    axisLabel: {
                        color: chartText
                    }
                },
                series: [{
                    itemStyle: {
                        shadowBlur: 20,
                        shadowColor: shadowColor,
                        shadowOffsetY: 10
                    },
                    lineStyle: {
                        width: 2,
                        shadowBlur: 20,
                        shadowColor: shadowColor,
                        shadowOffsetY: 10
                    },
                    areaStyle: {
                        opacity: 0.2,
                        color: {
                            type: 'linear',
                            x: 0,
                            y: 0,
                            x2: 0,
                            y2: 1,
                            colorStops: [{
                                offset: 0,
                                color: theme === 'dark' ? 'rgba(128, 128, 128, 0.4)' : 'rgba(128, 128, 128, 0.4)'
                            }, {
                                offset: 1,
                                color: theme === 'dark' ? 'rgba(128, 128, 128, 0.2)' : 'rgba(128, 128, 128, 0.2)'
                            }]
                        }
                    }
                }]
            };
            
            // 重新设置所有图表的主题
            // 获取所有图表实例
            const spendChartElement = document.getElementById('spend-conversion-chart');
            const clicksChartElement = document.getElementById('clicks-impressions-chart');
            const roiChartElement = document.getElementById('roi-chart');
            
            // 重新初始化图表
            if (spendChartElement) {
                const spendChart = echarts.init(spendChartElement);
                const option = spendChart.getOption();
                spendChart.setOption({
                    ...option,
                    ...chartStyle
                });
            }
            
            if (clicksChartElement) {
                const clicksChart = echarts.init(clicksChartElement);
                const option = clicksChart.getOption();
                clicksChart.setOption({
                    ...option,
                    ...chartStyle
                });
            }
            
            if (roiChartElement) {
                const roiChart = echarts.init(roiChartElement);
                const option = roiChart.getOption();
                roiChart.setOption({
                    ...option,
                    ...chartStyle
                });
            }
        }

        // 页面加载时检查并应用保存的主题设置
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            
            if (savedTheme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = '日间模式';
            }
            
            setDateRange('last30');
        });
    </script>
</body>
</html>
